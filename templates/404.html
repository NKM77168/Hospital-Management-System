{% extends 'base.html' %}
{% block title %}404 Not Found — MediCare HMS{% endblock %}
{% block page_title %}404{% endblock %}
{% block content %}
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;">
  <div style="font-size:6rem;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;">404</div>
  <h2 style="margin-top:.5rem;font-size:1.4rem;color:var(--text-primary);">Page Not Found</h2>
  <p style="color:var(--text-secondary);margin:.75rem 0 1.5rem;">The page you're looking for doesn't exist or has been moved.</p>
  <a href="{{ url_for('dashboard') }}" class="btn-primary-custom">
    <i class="fa-solid fa-house"></i> Back to Dashboard
  </a>
</div>
{% endblock %}
